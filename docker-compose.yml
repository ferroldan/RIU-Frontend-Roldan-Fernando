services:
  mock-api:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./db.json:/app/db.json
    command: sh -c "npm install -g json-server && json-server --watch db.json --port 3001 --host 0.0.0.0"
    ports:
      - "3001:3001"

  frontend:
    build: .
    ports:
      - "4200:80"
    depends_on:
      - mock-api
